<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>노퀴</title><link rel="stylesheet" href="/style.css"><script src="/join.js" defer></script></head>
<body>
<div class="shell">
  <header class="masthead"><a class="brand" href="/" aria-label="노퀴 홈">노퀴<span>NOQUI</span></a>
    <div class="identity" aria-label="플레이어 연결 상태">
      <span id="connection" class="connection"><i aria-hidden="true"></i><span id="connection-text">연결 중</span></span>
      <span id="avatar" class="avatar" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="M8 3h16v17H8zM4 23h24v9H4z" fill="currentColor"/></svg><img class="face" alt="" hidden><img class="hat" alt="" hidden></span>
      <span id="nickname" class="nickname">—</span>
    </div>
  </header>
  <main>
    <div class="eyebrow"><span id="round-label">대기실</span><span id="audio-status" role="status" aria-live="polite">연결 중</span></div>
    <section class="track" aria-labelledby="track-title"><p id="phase-label" class="phase">다음 라운드</p><h1 id="track-title" aria-live="polite">잠시만요</h1><div id="tags" class="tags" hidden></div><p id="message" class="message" aria-live="polite"></p></section>
    <section class="player" aria-label="오디오 플레이어">
      <div class="timeline"><time id="elapsed">0:00</time><progress id="progress" max="1" value="0" aria-label="라운드 진행"></progress><time id="remaining">—</time></div>
      <div class="controls"><div class="primary-controls"><button id="playback" class="text-button" type="button" aria-label="일시 정지" hidden>일시 정지</button><button id="takeover" class="primary" type="button" hidden>여기서 재생</button><span id="countdown" class="countdown" aria-live="off"></span></div>
        <div class="volume"><button id="mute" class="text-button" type="button" aria-label="음소거" aria-pressed="false">소리</button><input id="volume" type="range" min="0" max="100" value="65" aria-label="음량"><output id="volume-value" for="volume">65</output></div>
      </div>
      <audio id="audio" preload="metadata"></audio>
    </section>
    <section class="listeners" aria-label="함께 듣는 플레이어"><div class="section-line"><h2>함께 듣는 중</h2><span id="listener-count">0</span></div><div id="listeners" class="listener-list"></div></section>
  </main>
  <footer><span>mud.danta.qzz.io</span><div><button id="reconnect" class="text-button" type="button">다시 연결</button><button id="logout" class="text-button" type="button">연결 종료</button></div></footer>
</div>
</body></html>
