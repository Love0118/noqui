name: Noqui web
on:
  push:
    branches: [web]
  pull_request:
    branches: [web]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: cargo test --locked
      - run: node --test tests/browser.cjs
      - run: python3 -m unittest discover -s tools -p 'test_*.py'
  publish-web:
    if: github.ref == 'refs/heads/web' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    concurrency:
      group: publish-noqui-web
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked
      - name: Package Linux ARM64 service
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/package
          cp target/release/noqui-web tools/yt-dlp-private-cookies.sh dist/package/
          cp -R deploy dist/package/
          cp README.md dist/package/
          tar -C dist/package -czf dist/noqui-web-linux-arm64.tar.gz .
          cd dist
          sha256sum noqui-web-linux-arm64.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: noqui-web-linux-arm64
          path: |
            dist/noqui-web-linux-arm64.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
      - name: Publish web service
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/web" --jq '.object.sha')
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo 'A newer web commit exists; skipping outdated publication.'
            exit 0
          fi
          tag="web-build-$GITHUB_SHA"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" dist/noqui-web-linux-arm64.tar.gz dist/SHA256SUMS \
              --target "$GITHUB_SHA" --prerelease --title "Noqui web ${GITHUB_SHA:0:8}" \
              --notes 'Verified Rust service and playback page for Linux ARM64. Paper plugins are released from beta.'
          fi
